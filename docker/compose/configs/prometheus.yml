global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: 'integration'
    cluster: 'local'

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: 'django-app'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'

