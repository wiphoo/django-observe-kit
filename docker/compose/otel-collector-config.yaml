receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    limit_mib: 512
    check_interval: 1s

exporters:
  # Export to Prometheus for metrics (backup/alternative)
  prometheus:
    endpoint: "0.0.0.0:8889"
  # Export to HyperDX for unified observability (logs, traces, metrics)
  otlphttp:
    endpoint: ${HYPERDX_OTLP_ENDPOINT:-http://hyperdx:4318}
    headers:
      authorization: ${HYPERDX_API_KEY:-test-key}
    compression: gzip
    tls:
      insecure: true  # Set to false and configure certs for production
  # Debug exporter for debugging (replaces deprecated logging exporter)
  # This allows the collector to run and accept traces without external dependencies
  debug:
    verbosity: normal

service:
  # Telemetry endpoint for collector's own metrics
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # Export to HyperDX for trace visualization and debugging
      exporters: [otlphttp, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # Export to both HyperDX and Prometheus for metrics
      exporters: [otlphttp, prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      # Export to HyperDX for log visualization and debugging
      exporters: [otlphttp, debug]
