[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-observe-kit"
version = "0.1.0"
description = "Drop-in observability toolkit for Django/DRF/Wagtail"
readme = "README.md"
authors = [{ name = "Wiphoo (Terng) Methachawalit" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "django",
    "drf",
    "wagtail",
    "observability",
    "opentelemetry",
    "prometheus",
    "sentry",
    "tracing",
    "metrics",
    "logging",
    "pii",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    # Django 5.2 is the current LTS. Django 4.2 reached EOL in April 2026, and
    # DRF 3.18 (which adds Django 6.1 support) drops Django 4.2, 5.0 and 5.1.
    "Django>=5.2",
    "djangorestframework>=3.16",
    "prometheus-client>=0.26.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    # python-json-logger 3.x is the maintained line; 4.x is the current major.
    "python-json-logger>=3.0",
    # Capped below 3: sentry-sdk 3.x rejects init_sentry()'s
    # `before_send_transaction` option with a TypeError.
    "sentry-sdk>=2.66.1,<3",
]

[project.optional-dependencies]
wagtail = ["wagtail>=7.4.2"]

[project.urls]
Homepage = "https://github.com/wiphoo/django-observe-kit"
Documentation = "https://github.com/wiphoo/django-observe-kit/blob/main/docs/README.md"
Repository = "https://github.com/wiphoo/django-observe-kit"
Issues = "https://github.com/wiphoo/django-observe-kit/issues"
Changelog = "https://github.com/wiphoo/django-observe-kit/blob/main/CHANGELOG.md"

[tool.uv]
# Development lock only; not part of the published wheel metadata.
# The patched releases of wagtail's transitive dependencies need newer Pythons
# than this package: pillow 13 requires >=3.11 and soupsieve 4 requires >=3.11.5.
# Without this, the universal lock forks and keeps the vulnerable releases for
# older interpreters, so wagtail is only locked (and tested) on Python >=3.11.5.
override-dependencies = ["wagtail>=7.4.2; python_full_version >= '3.11.5'"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["observe_kit*"]

[tool.setuptools.package-data]
"observe_kit" = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Django-generated migrations are not hand-authored; their long field
# definitions routinely exceed the line-length limit.
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# F401: unused imports (automatically removed by ruff --fix)
# I: import sorting (automatically sorted by ruff --fix)

[tool.ruff.lint.isort]
known-first-party = ["observe_kit"]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "uv>=0.11.15",
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.0.0",
    "coverage>=7.15.3",
    "mypy>=2.3.0",
    "hypothesis>=6.165.3",
    "wagtail>=7.4.2",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "wagtail.*",
    "prometheus_client.*",
    "opentelemetry.*",
    "sentry_sdk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require docker stack)",
    "e2e: marks tests as end-to-end tests",
]
