[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "observe_kit"
version = "0.1.0"
description = "Drop-in observability toolkit for Django/DRF/Wagtail"
readme = "README.md"
authors = [{ name = "Observe Kit" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "Django>=3.2",
    "djangorestframework>=3.14",
    "prometheus-client>=0.15",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "python-json-logger>=2.0.7",
    "sentry-sdk>=1.40.0",
]

[project.optional-dependencies]
wagtail = ["wagtail>=5"]
dev = [
    "ruff>=0.6.4",
    "uv>=0.4.0",
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["observe_kit*"]

[tool.setuptools.package-data]
"observe_kit" = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"
