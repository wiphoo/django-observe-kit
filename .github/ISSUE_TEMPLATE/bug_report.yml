name: Bug report
description: Report a reproducible problem in Django Observe Kit
title: "bug: "
labels:
  - type/bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the
        sections below. **Do not include tokens, credentials, PII, or other
        sensitive values** anywhere in this report — redact log/trace output.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Configure observe_kit with '...'
        2. Make a request to '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which area is affected? (select all that apply)
      multiple: true
      options:
        - Context & middleware
        - Logging (PII sanitization)
        - OpenTelemetry tracing
        - Prometheus metrics / health
        - Sentry enrichment
        - DRF integration
        - Audit logging
        - Wagtail integration
        - Packaging / build
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: >
        Include the relevant `OBSERVE_KIT` settings and middleware order.
        **Redact any tokens, DSNs, or PII.**
      render: python
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions and platform details.
      value: |
        - django-observe-kit version:
        - Python version:
        - Django version:
        - DRF version (if applicable):
        - Wagtail version (if applicable):
        - Operating system:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: >
        Paste any error messages, log events, or stack traces. **Do not include
        tokens, credentials, or PII.**
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context here (minimal reproducible example, screenshots, etc.).
