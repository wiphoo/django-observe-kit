name: Feature request
description: Propose a new feature or improvement for Django Observe Kit
title: "feat: "
labels:
  - type/feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this feature solve?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >
        Describe the proposed behavior. Where useful, include an example of how
        you would configure or use the feature.
      render: python
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which area would this affect? (select all that apply)
      multiple: true
      options:
        - Context & middleware
        - Logging (PII sanitization)
        - OpenTelemetry tracing
        - Prometheus metrics / health
        - Sentry enrichment
        - DRF integration
        - Audit logging
        - Wagtail integration
        - CI / release automation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you have considered.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any relevant context, documentation links, or prior art here.
