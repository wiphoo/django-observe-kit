version: 2
updates:
  # Python dependencies for the library. The repo commits uv.lock and `uv sync`
  # is the standard install path, so use the `uv` ecosystem (not `pip`) — it is
  # what refreshes the committed lockfile.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Each example app under examples/ is its own standalone uv project with its
  # own uv.lock. Glob is only supported by the `directories` (plural) key.
  # Group updates per example to keep the PR volume manageable.
  - package-ecosystem: "uv"
    directories:
      - "/examples/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      example-deps:
        patterns:
          - "*"

  # GitHub Actions used in workflows (keeps SHA-pinned actions current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
