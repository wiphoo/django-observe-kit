[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "example-django-observe-kit-sentry"
version = "0.1.0"
description = "Sentry example for observe_kit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=4.2,<5.0",
    "djangorestframework>=3.14,<4.0",
    "django-observe-kit",
    "sentry-sdk>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
# Use the in-repo package so the example always resolves against the current source tree.
django-observe-kit = { path = "../..", editable = true }
