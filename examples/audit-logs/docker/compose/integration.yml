services:
  postgres:
    image: postgres:16-alpine
    container_name: example-observe-kit-audit-postgres
    environment:
      - POSTGRES_DB=${OBSERVE_KIT_DB_NAME:-observe_kit_audit}
      - POSTGRES_USER=${OBSERVE_KIT_DB_USER:-observe_kit}
      - POSTGRES_PASSWORD=${OBSERVE_KIT_DB_PASSWORD:-observe_kit}
    ports:
      - "${OBSERVE_KIT_DB_PORT:-5432}:5432"
    volumes:
      - audit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OBSERVE_KIT_DB_USER:-observe_kit} -d ${OBSERVE_KIT_DB_NAME:-observe_kit_audit}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    container_name: example-observe-kit-audit-adminer
    ports:
      - "${OBSERVE_KIT_ADMINER_PORT:-8081}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  audit-postgres-data:
    name: example-observe-kit-audit-postgres-data
